name: A-share Daily Report

on:
  schedule:
    - cron: '30 7 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: a-share-daily
  cancel-in-progress: false

env:
  TZ: Asia/Shanghai

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily signals
        run: python ci/run_signals.py

      - name: Run portfolio rebalance
        run: python ci/run_portfolio.py

      - name: Generate HTML report
        run: python ci/generate_report.py

      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f signals/ public/
          git diff --cached --quiet || git commit -m "Daily report $(date +%Y-%m-%d)"
          git push origin main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
